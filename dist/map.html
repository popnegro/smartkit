<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartKit – Mapa de Pantallas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js?v=3a6cc09"></script>
<link rel="stylesheet" href="styles.css?v=3a6cc09">
</head>
<body>

<!-- ── TOP BAR ── -->
<header class="top"></header>

<!-- ── SEARCH ── -->
<div class="search-bar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" type="search" placeholder="Buscar pantalla…" autocomplete="off">
  </div>
</div>

<!-- ── FILTER CHIPS ── -->
<div class="filters-bar" style="position: fixed; top: 64px; left: 250px; right: 18px; z-index: 400;">
  <div class="filter-chips" id="zone-filter-chips"></div>
  <div class="filter-chips" id="type-filter-chips"></div>
  <button class="btn ghost sm" id="btn-clear-filters" style="display:none">Limpiar filtros</button>
</div>

<!-- ── MAP ── -->
<div id="map"></div>

<!-- ── MAP COUNTER ── -->
<div class="map-counter" id="map-counter">0 pantallas</div>

<!-- ── LEGEND ── -->
<div class="legend">
  <div class="legend-item"><div class="dot dot-p"></div>Peatonal</div>
  <div class="legend-item"><div class="dot dot-v"></div>Vehicular</div>
  <div class="legend-item"><div class="dot dot-m"></div>Mixto</div>
</div>

<!-- ── SCREEN PANEL ── -->
<aside class="sc-panel" id="sc-panel" role="dialog" aria-label="Detalle de pantalla">
  <div class="sc-panel-head">
    <h2 id="sc-title">—</h2>
    <button class="sc-close" id="sc-close" title="Cerrar">✕</button>
  </div>
  <div class="sc-hero" id="sc-hero"></div>
  <div class="sc-body" id="sc-body"></div>
</aside>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script src="shared.js?v=3a6cc09"></script>
<script src="nav.js?v=3a6cc09"></script>
<script src="map.js?v=3a6cc09"></script>
<script src="footer.js?v=3a6cc09"></script>
</body>
</html>
