name: Deploy SmartKit to Vercel

on:
  push:
    branches:
      - main          # → Production
      - develop       # → Preview
  pull_request:
    branches:
      - main          # → Preview (para revisar antes de merge)

# Evita deploys simultáneos en la misma rama
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Validación básica ────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que no hay .env en el repo
        run: |
          if git ls-files | grep -q '\.env$'; then
            echo "❌ ERROR: Archivo .env encontrado en el repositorio."
            echo "Agregar .env al .gitignore y removerlo con 'git rm --cached .env'"
            exit 1
          fi
          echo "✅ No se encontraron archivos .env versionados."

      - name: Verificar estructura de API
        run: |
          required_files=(
            "api/_cors.js"
            "api/db.js"
            "api/screens/index.js"
            "api/screens/all.js"
            "api/config/index.js"
            "api/kits/index.js"
            "api/kits/[id].js"
            "api/clients/index.js"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Archivo requerido no encontrado: $file"
              exit 1
            fi
          done
          echo "✅ Estructura de API correcta."

  # ── Deploy a Preview (PRs y rama develop) ───────────────────────────────
  deploy-preview:
    name: Deploy → Preview
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref != 'refs/heads/main'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Deploy a Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Sin --prod = Preview deployment
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS_PREVIEW }}
          NODE_ENV: preview

      - name: Comentar URL de Preview en PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview desplegado\n\n**URL:** ${{ steps.deploy.outputs.preview-url }}\n\n*Commit: \`${{ github.sha }}\`*`
            })

  # ── Deploy a Producción (rama main) ────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://tu-proyecto.vercel.app  # Actualizar con tu dominio real
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Instalar dependencias
        run: npm ci

      - name: Build Demo Version
        run: |
          chmod +x public/build.sh
          cd public && ./build.sh demo

      - name: Deploy a Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          vercel-cwd: 'public/dist' # ← Despliega el contenido de public/dist
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS_PRODUCTION }}
          NODE_ENV: production

      - name: Notificar éxito en Slack (opcional)
        if: success()
        run: |
          echo "✅ Deploy a producción completado: ${{ github.sha }}"
          # Descomentar y configurar para notificaciones reales:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"✅ SmartKit desplegado a producción: ${{ github.sha }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
