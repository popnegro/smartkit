<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartKit | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css">
  </head>
  <body class="login-page">
    <main>
      <div class="login-card sk-card">
        <div class="planner-logo logo-center">
          <span class="planner-logo-mark">SK</span>
          <span class="logo-word">SmartKit<small>ADMIN</small></span>
        </div>
        <h1>Bienvenido de nuevo</h1>
        <p>Ingresa tus credenciales para gestionar la plataforma</p>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="admin@smartkit.com" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="blue-button full-width">Iniciar Sesión</button>
        </form>
      </div>
    </main>
    <script>
      // La lógica de login debe manejarse aquí, no en línea.
      document.getElementById('login-form').addEventListener('submit', (event) => {
        event.preventDefault();
        // Aquí iría la lógica de autenticación real.
        // Para el prototipo, redirigimos a admin.html.
        window.location.href = 'admin.html';
      });
    </script>
  </body>
</html>
