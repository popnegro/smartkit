<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartKit | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
      .login-page { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
      .login-card { width: 100%; max-width: 400px; padding: 40px; text-align: center; }
      .login-card h1 { margin: 24px 0 8px; font-size: 24px; color: var(--sk-text); }
      .login-card p { color: var(--sk-muted); margin-bottom: 32px; }
      .form-group { text-align: left; margin-bottom: 20px; }
      .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
      .form-group input { width: 100%; height: 46px; padding: 0 16px; border: 1px solid var(--sk-border); border-radius: var(--sk-radius-sm); outline: none; }
      .form-group input:focus { border-color: var(--sk-primary); }
    </style>
  </head>
  <body class="login-page">
    <div class="login-card sk-card">
      <div class="planner-logo" style="justify-content: center;">
        <span class="planner-logo-mark">SK</span>
        <span class="logo-word" style="text-align: left;">SmartKit<small>ADMIN</small></span>
      </div>
      <h1>Welcome back</h1>
      <p>Enter your credentials to manage the platform</p>
      <form onsubmit="event.preventDefault(); window.location.href='admin.html'">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="admin@smartkit.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="blue-button" style="width: 100%; margin-top: 10px;">Sign In</button>
      </form>
    </div>
  </body>
</html>
