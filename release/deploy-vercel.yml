name: Deploy to Vercel

on:
  push:
    branches:
      - main # O la rama que uses para producción, ej: master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Check out the code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Run the build script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: 4. Deploy to Vercel
        uses: amondnet/vercel-action@v25 # O la versión más reciente
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-project-directory: dist # Indica a Vercel que despliegue el contenido de la carpeta 'dist'
          scope: ${{ secrets.VERCEL_ORG_ID }}